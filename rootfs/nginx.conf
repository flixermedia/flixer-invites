# Same-origin front door for Flixer Invites: web app on /, the API on /api. Unprivileged (runs as `node`).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 25m;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Native app WebViews have fixed localhost origins; browser requests are same-origin.
    map $http_origin $cors_origin {
        default                  "";
        "https://localhost"      $http_origin;
        "http://localhost"       $http_origin;
        "ionic://localhost"      $http_origin;
        "capacitor://localhost"  $http_origin;
    }

    map "$request_method:$uri" $cors_preflight {
        default 0;
        "~^OPTIONS:/api/oidc/" 0;
        "~^OPTIONS:/\.well-known/oauth-authorization-server/api/oidc$" 0;
        "~^OPTIONS:" 1;
    }

    upstream flixer_api { server 127.0.0.1:8081; }

    server {
        listen 8080;
        server_name _;

        root /srv/web;
        index index.html;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Cache-Control, Content-Type, If-Modified-Since, If-None-Match, If-Range, Range, X-Flixer-App-Image-Cache, X-Setup-Recovery-Code" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        if ($cors_preflight = 1) { return 204; }

        location = /healthz {
            access_log off;
            return 204;
        }

        location ^~ /api/oidc/ {
            proxy_pass http://flixer_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Expose-Headers;
            proxy_pass_header Access-Control-Max-Age;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /.well-known/oauth-authorization-server/api/oidc {
            proxy_pass http://flixer_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            add_header X-Content-Type-Options nosniff always;
        }

        location /api/ {
            proxy_pass http://flixer_api;
            proxy_http_version 1.1;
            proxy_set_header Origin "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
